name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          Write-Output "Commit: $env:GITHUB_SHA"
          Write-Output "Rust: $(rustc --version)"
          Write-Output "Cargo: $(cargo --version)"
          Write-Output "Target: $env:RUST_TARGET"
          rustc -vV

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Locate the Windows SDK fxc.exe
        shell: pwsh
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          if (-not (Test-Path $kits)) {
            throw "Windows SDK bin directory not found at $kits"
          }
          $fxc = Get-ChildItem -Path $kits -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            throw "No Windows SDK x64 fxc.exe found under $kits"
          }
          Write-Output "Using fxc.exe: $($fxc.FullName)"
          Write-Output "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:VCToolsInstallDir) {
            Write-Output "MSVC tools: $env:VCToolsInstallDir"
          }

      - name: Identify Rust cache
        id: rust-cache
        shell: bash
        run: echo "version=$(rustc -V)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/incremental
            !target/**/lime*
          key: lime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-${{ github.sha }}
          restore-keys: |
            lime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy including test targets
        run: cargo clippy --all-targets --locked --target ${{ env.RUST_TARGET }} -- -D warnings

      - name: Run the safety suite and regression tests
        run: cargo test --locked --target ${{ env.RUST_TARGET }}

      - name: Build release executable
        run: cargo build --release --locked --target ${{ env.RUST_TARGET }}

      - name: Test the release headless PDF worker
        run: python3 scripts/check-pdf-worker.py --binary target/${{ env.RUST_TARGET }}/release/lime.exe

      - name: Verify the executable icon and manifest
        shell: pwsh
        run: ./scripts/verify-windows-resources.ps1 -Executable "target/${{ env.RUST_TARGET }}/release/lime.exe"

      - name: Package the x64 portable build
        id: package
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $version = (Select-String -Path (Join-Path $env:GITHUB_WORKSPACE "Cargo.toml") -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $name = "Lime-$version-windows-x64"
          $zip = Join-Path $env:GITHUB_WORKSPACE "$name.zip"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist-windows"
          $exe = Join-Path $env:GITHUB_WORKSPACE "target\$env:RUST_TARGET\release\lime.exe"
          if (-not (Test-Path $exe)) {
            throw "Release executable not found at $exe"
          }

          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item $exe (Join-Path $out "Lime.exe")

          @"
          Lime - Lite Image Editor
          Windows x64 portable release

          Version: $version
          Commit: $env:GITHUB_SHA ($shortSha)
          Built from: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Target: $env:RUST_TARGET

          This is a portable program. Extract the ZIP and run Lime.exe; there is
          no installer. Release downloads are available at:
          https://github.com/eimg/lime/releases

          Requirements:
          - 64-bit Windows 10 or later with DirectX.
          - Microsoft Visual C++ Redistributable 2015-2022 (x64) if the
            vcruntime/UCRT DLLs are not already installed.

          Known limitations:
          - No code signing or .lime / Open With file association yet.
          - Native menu appearance may vary with Windows theme and accessibility
            settings.
          "@ | Set-Content -Path (Join-Path $out "READ-ME.txt") -Encoding utf8

          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -Force
          Write-Output "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
